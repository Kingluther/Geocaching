<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie des Héros - Chasses aux trésors scénarisées</title>
    <style>
        :root {
            --brun-sombre: #3e2723;
            --brun-clair: #8d6e63;
            --fond: #fdfaf4;
        }

        body { margin: 0; font-family: 'Trebuchet MS', sans-serif; background-color: var(--brun-sombre); color: white; overflow-x: hidden; }
        
        /* Navigation */
        nav { background-color: rgba(0,0,0,0.5); padding: 15px; display: flex; gap: 20px; justify-content: center; position: sticky; top: 0; z-index: 100; }
        nav a { color: #f5f5f5; text-decoration: none; font-weight: bold; padding: 8px 15px; border-radius: 4px; transition: background 0.3s; }
        nav a:hover { background: var(--brun-clair); }

        /* Frise des personnages en haut */
        .frise-container {
            background: rgba(0,0,0,0.4);
            padding: 20px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap; 
            gap: 15px;
            border-bottom: 2px solid var(--brun-clair);
        }

        .vignette-choix {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            filter: grayscale(100%) brightness(0.6);
            transition: all 0.3s ease;
            border: 3px solid transparent;
            object-fit: cover;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Effet quand la vignette est active ou survolée */
        .vignette-choix:hover, .vignette-choix.active {
            filter: grayscale(0%) brightness(1);
            border-color: #ffeb3b;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.5);
            z-index: 10;
        }

        /* Zone d'affichage du personnage */
        .hero-display {
            display: flex;
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            align-items: center;
            min-height: 500px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(62,39,35,1) 0%, rgba(141,110,99,1) 100%);
        }

        .hero-info { flex: 1; padding: 40px; background: rgba(0,0,0,0.6); border-radius: 15px; border-left: 5px solid #ffeb3b; }
        .hero-info h2 { color: #ffeb3b; font-size: 2.5em; margin-top: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .hero-info p { line-height: 1.6; font-size: 1.1em; }

        .hero-image-container { flex: 1; text-align: center; }
        .hero-large-img { max-width: 90%; max-height: 450px; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8)); transition: opacity 0.3s; }

        .tagline { font-style: italic; color: #ddd; margin-bottom: 20px; font-size: 1.2em; }
        .likes-dislikes { display: flex; gap: 40px; margin-top: 30px; flex-wrap: wrap; }
        .likes h4 { color: #4caf50; margin-bottom: 5px; font-size: 1.2em; text-transform: uppercase; }
        .dislikes h4 { color: #e74c3c; margin-bottom: 5px; font-size: 1.2em; text-transform: uppercase; }

        @media (max-width: 768px) {
            .hero-display { flex-direction: column-reverse; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">📍 Carte des Quêtes</a>
        <a href="galerie.html" style="background: var(--brun-clair);">🎭 Galerie des Héros</a>
    </nav>

    <div class="frise-container" id="frise">
        </div>

    <div class="hero-display" id="hero-content">
        <div class="hero-info">
            <p id="hero-tagline" class="tagline"></p>
            <h2 id="hero-name">Sélectionnez un héros</h2>
            <p id="hero-bio"></p>
            
            <div class="likes-dislikes">
                <div class="likes">
                    <h4>Aime</h4>
                    <p id="hero-likes"></p>
                </div>
                <div class="dislikes">
                    <h4>N'aime pas</h4>
                    <p id="hero-dislikes"></p>
                </div>
            </div>
        </div>
        <div class="hero-image-container">
            <img src="" id="hero-img" class="hero-large-img" alt="Illustration du personnage">
        </div>
    </div>

    <script>
        // 1. Dictionnaire des Profils
        const profils = {
            al: { 
                name: "Al", bioImg: "Al bio.png", tag: "Le margouillat farceur", 
                bio: "Gekko réunionnais, aussi surnommé « le margouillat », il adore raconter des blagues... pas toujours drôles il est vrai. Sa spécialité ? Monter aux murs, bien sûr !", 
                likes: "Les bonnes blagues et l'escalade", dislikes: "Tomber d'un mur en plein fou rire" 
            },
            pies: { 
                name: "Saro, Cabia et Casso", bioImg: "Pies.png", tag: "Les trois pies artistes", 
                bio: "Chacune avec son style différent, bien sûr. Férues d'art visuel et de paysages champêtres, elles vous guideront à la découverte de la peinture et des autres arts.", 
                likes: "L'art visuel et les paysages champêtres", dislikes: "Les toiles blanches et le manque d'inspiration" 
            },
            didier: { 
                name: "Didier", bioImg: "Didier bio.png", tag: "Le butineur tête en l'air", 
                bio: "Son truc à lui, c'est butiner. Fin connaisseur de fleurs et de parfums, il est assez tête en l'air et volette à sa guise par monts et par vaux.", 
                likes: "Les fleurs et les beaux parfums", dislikes: "Rester immobile et la grisaille" 
            },
            harry: { 
                name: "Harry", bioImg: "Harry bio.png", tag: "Le yak expatrié", 
                bio: "Harry a passé quelques années de sa vie aux Etats-Unis. Désabusé du « modèle américain », il est rentré il y a peu, ramenant avec lui son savoir d'expatrié.", 
                likes: "Partager son savoir et les grands espaces", dislikes: "Le modèle américain" 
            },
            jeanine: { 
                name: "Jeanine", bioImg: "Jeanine bio.png", tag: "La tortue centenaire", 
                bio: "Son savoir est aussi grand que sa générosité. Espiègle, elle n'hésite pas à entrainer ses visiteurs dans des récits inspirés et inspirants.", 
                likes: "Raconter des histoires inspirantes", dislikes: "La précipitation" 
            },
            kcor: { 
                name: "Kçor", bioImg: "Kçor bio.png", tag: "Le mystère du Bassac", 
                bio: "Un personnage encore mystérieux qui arpente les environs du Bassac... (Histoire en cours d'écriture !)", 
                likes: "Garder ses secrets", dislikes: "Qu'on dévoile la fin de l'histoire avant l'heure" 
            },
            loumpour: { 
                name: "Loumpour", bioImg: "Loumpour bio.png", tag: "La jeune koala curieuse", 
                bio: "Curieuse de tout, elle adore grimper aux arbres et apprendre de nouvelles choses. Elle est aussi très connaisseuse en matière de sport.", 
                likes: "Grimper aux arbres, le sport et apprendre", dislikes: "L'ennui et rester au sol" 
            },
            mala: { 
                name: "Mala", bioImg: "Mala bio.png", tag: "Le rat réfugié", 
                bio: "Ce rat malheureux a fui la guerre dans son pays pour venir se réfugier dans la région. Fragile, il est en quête d'un abri de fortune pour améliorer son existence, et de nouveaux amis pour donner du sens à sa vie.", 
                likes: "La sécurité et se faire de nouveaux amis", dislikes: "La guerre, la solitude et le danger" 
            },
            lamas: { 
                name: "Serge et Bernard", bioImg: "Lama.png", tag: "Les lamas jumeaux", 
                bio: "Bien que leur humour vole parfois au ras des pâquerettes qu'ils broutent, ils sont toujours intéressés par apprendre de nouvelles choses et adorent chercher des trésors.", 
                likes: "Chercher des trésors et brouter les pâquerettes", dislikes: "L'humour trop sophistiqué" 
            }
        };

       // 2. Liste des vignettes de la frise (Ordre alphabétique)
        const friseIcons = [
            { id: "al", img: "Al.png", profilCible: "al" },
            { id: "bernard", img: "Bernard.jpg", profilCible: "lamas" },
            { id: "cabia", img: "Cabia.png", profilCible: "pies" },
            { id: "casso", img: "Casso.png", profilCible: "pies" },
            { id: "didier", img: "Didier.jpg", profilCible: "didier" }, 
            { id: "harry", img: "Harry.png", profilCible: "harry" },
            { id: "jeanine", img: "Jeanine.png", profilCible: "jeanine" },
            { id: "kcor", img: "Kçor.png", profilCible: "kcor" },
            { id: "loumpour", img: "Loumpour.jpg", profilCible: "loumpour" },
            { id: "mala", img: "Mala.png", profilCible: "mala" },
            { id: "saro", img: "Saro.png", profilCible: "pies" },
            { id: "serge", img: "Serge.jpg", profilCible: "lamas" }
        ];

        const friseContainer = document.getElementById('frise');

        // 3. Génération de la frise
        friseIcons.forEach((icon) => {
            const imgElement = document.createElement('img');
            imgElement.src = icon.img;
            imgElement.className = 'vignette-choix';
            imgElement.alt = icon.id;
            imgElement.dataset.profil = icon.profilCible; 
            
            imgElement.onclick = () => showHero(icon.profilCible);
            friseContainer.appendChild(imgElement);
        });

        // 4. Fonction d'affichage
        function showHero(idProfil) {
            const data = profils[idProfil];
            
            // Mise à jour du texte et de la grande image
            document.getElementById('hero-name').innerText = data.name;
            document.getElementById('hero-tagline').innerText = data.tag;
            document.getElementById('hero-bio').innerText = data.bio;
            document.getElementById('hero-likes').innerText = data.likes;
            document.getElementById('hero-dislikes').innerText = data.dislikes;
            document.getElementById('hero-img').src = data.bioImg;

            // Mise en surbrillance des vignettes correspondantes
            const toutesLesVignettes = document.querySelectorAll('.vignette-choix');
            toutesLesVignettes.forEach(vignette => {
                if (vignette.dataset.profil === idProfil) {
                    vignette.classList.add('active');
                } else {
                    vignette.classList.remove('active');
                }
            });
        }

        // Chargement du premier profil par défaut
        showHero("al");
    </script>
</body>
</html>
